name: Verify an SDK package at the checked-out revision
description: Shared native tests, package inspection and isolated consumers; no release or registry credentials.
inputs:
  sdk:
    required: true
    description: js, elixir or rust
  revision:
    required: true
    description: Full immutable source SHA
  contract-prefix:
    required: true
    description: Artifact prefix for the successful full eleven-SDK contract run
  tools-directory:
    required: false
    default: .
    description: Reviewed tooling checkout, separate from package source during release verification
runs:
  using: composite
  steps:
    - name: Bind package checks to the exact source revision
      shell: bash
      run: node "$TOOLS_DIRECTORY/scripts/releases/preflight.cjs" source
      env:
        TOOLS_DIRECTORY: ${{ inputs.tools-directory }}
        VERIFY_SDK: ${{ inputs.sdk }}
        VERIFY_REVISION: ${{ inputs.revision }}
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.24.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24.16.0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.contract-prefix }}-contract
        path: .contract-artifacts
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        pattern: ${{ inputs.contract-prefix }}-receipt-*
        path: .contract-artifacts/receipts
        merge-multiple: true
    - name: Verify complete contract receipts before packaging
      shell: bash
      run: node -e 'require(require("node:path").resolve(process.env.TOOLS_DIRECTORY, "scripts/releases/preflight.cjs")).contractEvidence(".contract-artifacts", process.env.VERIFY_REVISION)'
      env:
        TOOLS_DIRECTORY: ${{ inputs.tools-directory }}
        VERIFY_REVISION: ${{ inputs.revision }}
    - uses: ./.github/actions/test-server
    - name: Install the reviewed OIDC-capable npm CLI
      shell: bash
      run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
    - if: inputs.sdk == 'elixir'
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        otp-version: "26.2"
        elixir-version: "1.15.7"
    - if: inputs.sdk == 'elixir'
      shell: bash
      working-directory: clients/elixir
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get --check-locked
        mix test
      env:
        TEST_SERVER_HOST: localhost:3000
        VEXILLA_CONTRACT_DIR: ${{ github.workspace }}/.contract-artifacts
    - if: inputs.sdk == 'rust'
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        cargo +stable test --locked --manifest-path clients/rust/Cargo.toml
      env:
        TEST_SERVER_HOST: localhost:3000
        VEXILLA_CONTRACT_DIR: ${{ github.workspace }}/.contract-artifacts
    - if: inputs.sdk == 'js'
      name: Verify npm 12 installation policy and isolated SDK consumers
      shell: bash
      run: |
        node "$TOOLS_DIRECTORY/scripts/releases/preflight-npm-policy.cjs" release-artifacts/npm-policy.json
        pnpm install --frozen-lockfile --ignore-scripts --filter @vexilla/client...
        pnpm --filter @vexilla/types build
        pnpm --filter @vexilla/publishing build
        pnpm --filter @vexilla/client test
        pnpm --filter @vexilla/client compile
        npm pack ./clients/js --ignore-scripts --json --pack-destination release-artifacts
        node "$TOOLS_DIRECTORY/clients/js/scripts/check-package.cjs" "$GITHUB_WORKSPACE"/release-artifacts/*.tgz > release-artifacts/js-consumer.json
      env:
        TOOLS_DIRECTORY: ${{ inputs.tools-directory }}
        SDK_SOURCE_ROOT: ${{ github.workspace }}
        TEST_SERVER_HOST: localhost:3000
        VEXILLA_CONTRACT_DIR: ${{ github.workspace }}/.contract-artifacts
    - if: inputs.sdk != 'js'
      shell: bash
      run: python3 "$TOOLS_DIRECTORY/scripts/releases/package-native.py" "$VERIFY_SDK" --revision "$VERIFY_REVISION" --output release-artifacts
      env:
        TOOLS_DIRECTORY: ${{ inputs.tools-directory }}
        SDK_SOURCE_ROOT: ${{ github.workspace }}
        VERIFY_SDK: ${{ inputs.sdk }}
        VERIFY_REVISION: ${{ inputs.revision }}
        RUSTUP_TOOLCHAIN: stable
    - name: Record fresh package, consumer, native and toolchain evidence
      shell: bash
      run: node "$TOOLS_DIRECTORY/scripts/releases/preflight.cjs" package
      env:
        TOOLS_DIRECTORY: ${{ inputs.tools-directory }}
        VERIFY_SDK: ${{ inputs.sdk }}
        VERIFY_REVISION: ${{ inputs.revision }}
        RUSTUP_TOOLCHAIN: stable
