name: Start the checked-out test server
description: Serve this commit's SDK fixtures instead of a previously published image.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install test server dependencies
      shell: bash
      working-directory: packages/test-server
      run: npm ci --ignore-scripts --workspaces=false
    - name: Start test server and wait for readiness
      shell: bash
      working-directory: packages/test-server
      run: |
        log_file="$RUNNER_TEMP/vexilla-test-server.log"
        npm start --workspaces=false > "$log_file" 2>&1 &
        server_pid=$!
        for _attempt in {1..30}; do
          if node -e 'fetch("http://localhost:3000/manifest.json").then(r => { if (!r.ok) { process.exit(1); } }).catch(() => process.exit(1))'; then
            echo "Test server ready on port 3000 (PID $server_pid)"
            exit 0
          fi
          if ! kill -0 "$server_pid" 2>/dev/null; then
            cat "$log_file"
            exit 1
          fi
          sleep 1
        done
        cat "$log_file"
        kill "$server_pid"
        exit 1
