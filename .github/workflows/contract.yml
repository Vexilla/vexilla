name: SDK JSON contract
on:
  workflow_call:
permissions:
  contents: read
jobs:
  producer:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @vexilla/types check:generated
      - run: pnpm contract:generate
      - run: pnpm contract:test:producer
      - run: pnpm contract:test:gate
      - run: pnpm --filter app exec playwright install --with-deps chromium
      - run: pnpm --filter app test:browser
      - run: pnpm --filter @vexilla/client compile && pnpm --filter app build
      - id: inventory
        run: |
          node -e 'require("./contract/scripts/gate.cjs").checkInventory(require("./contract/inventory.json"))'
          node -e 'console.log("matrix=" + JSON.stringify({include:require("./contract/inventory.json")}))' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-contract
          path: .contract-artifacts/*.json
          include-hidden-files: true
          if-no-files-found: error
  consumers:
    needs: producer
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.producer.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    name: contract (${{ matrix.id }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: sdk-contract
          path: .contract-artifacts
      - if: matrix.id == 'js'
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - if: matrix.id == 'js'
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @vexilla/client...
      - if: matrix.id == 'js'
        run: pnpm --filter @vexilla/types build
      - if: matrix.id == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - if: matrix.id == 'python'
        run: python -m pip install --require-hashes -r clients/python/contract-requirements.txt
      - if: matrix.id == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: clients/go/go.sum
      - if: matrix.id == 'rust'
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - if: matrix.id == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - if: matrix.id == 'kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - if: matrix.id == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pcov
          tools: composer:2.2
      - if: matrix.id == 'php'
        run: composer install --no-interaction --prefer-dist --no-dev --working-dir=clients/php
      - if: matrix.id == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '26.2'
          elixir-version: '1.15.7'
      - if: matrix.id == 'elixir'
        run: mix deps.get
        working-directory: clients/elixir
      - if: matrix.id == 'ocaml'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14.2'
      - if: matrix.id == 'ocaml'
        run: opam install . --deps-only --with-test --yes
        working-directory: clients/ocaml
      - run: node contract/scripts/run.cjs "$SDK"
        env:
          SDK: ${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: contract-receipt-${{ matrix.id }}
          path: .contract-artifacts/receipts/${{ matrix.id }}.json
          include-hidden-files: true
          if-no-files-found: error
  gate:
    name: Required SDK JSON contract
    if: always()
    needs: [producer, consumers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: sdk-contract
          path: .contract-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: contract-receipt-*
          path: .contract-artifacts/receipts
          merge-multiple: true
      - run: node contract/scripts/gate.cjs
        env:
          PRODUCER_RESULT: ${{ needs.producer.result }}
          CONSUMERS_RESULT: ${{ needs.consumers.result }}
