name: SDK release automation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Validate workflow syntax with checksum-pinned actionlint
        run: |
          curl --fail --silent --show-error --location --max-time 60 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/sdk-*.yml .github/workflows/contract.yml
      - run: npm ci --ignore-scripts --prefix scripts/releases
      - run: node scripts/releases/check-release-config.cjs
      - run: node --test scripts/releases/*.test.cjs
      - run: node --test contract/scripts/gate.test.cjs
