name: Test
on:
  pull_request:
    types:
      - closed
  push:
    branches:
      - "*"
    paths-ignore:
      - "**.md"

jobs:
  sdk-json-contract:
    uses: ./.github/workflows/contract.yml

  publish-test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./packages/test-server"

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: vexilla
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Build Test Server Image
        run: |
          docker build . --tag ghcr.io/vexilla/test-server:latest
          docker push ghcr.io/vexilla/test-server:latest

  test-bazel:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-server

      # Output bases contain compiler paths specific to the runner image.
      - name: Cache Bazel downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel/_bazel_*/cache/repos/v1
          key: ${{ runner.os }}-${{ runner.arch }}-bazel-repos-v1-${{ hashFiles('.bazelversion', '.bazelrc', 'WORKSPACE', 'WORKSPACE.bazel', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bazel-repos-v1-
      - run: bazel build //...
      - run: bazel coverage --combined_report=lcov //...
        env:
          TEST_SERVER_HOST: localhost:3000

  test-elixir:
    needs: sdk-json-contract
    runs-on: ubuntu-latest
    container: elixir:1.15.7

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdk-contract
          path: .contract-artifacts
      - uses: ./.github/actions/test-server

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            /clients/elixir/_build
            /clients/elixir/deps
          key: ${{ runner.os }}-elixir-${{ hashFiles('clients/elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-elixir-

      - run: |
          cd ./clients/elixir
          mix deps.get
          mix local.hex --force
          mix test --cover --export-coverage default
          mix test.coverage
        env:
          TEST_SERVER_HOST: localhost:3000
          VEXILLA_CONTRACT_DIR: ${{ github.workspace }}/.contract-artifacts

  test-kotlin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-server

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 8

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Execute Gradle build and then test
        run: |
          cd clients/kotlin
          ./gradlew build
          ./gradlew test
        env:
          TEST_SERVER_HOST: http://localhost:3000

  test-ocaml:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-server

      - name: Set-up OCaml 4.14.2
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14.2"
          opam-repositories: |
            default: https://opam.ocaml.org
            archive: git+https://github.com/ocaml/opam-repository-archive

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ocaml
            /clients/ocaml/opam
          key: ${{ runner.os }}-ocaml-${{ hashFiles('**/*.opam.locked') }}
          restore-keys: |
            ${{ runner.os }}-ocaml-

      - run: |
          cd ./clients/ocaml
          opam install . --deps-only --with-test --locked
          opam install alcotest alcotest-lwt
          opam exec -- dune build
          opam exec -- dune test
        env:
          TEST_SERVER_HOST: localhost:3000

  test-php:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-server

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Set-up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: composer:v2
          extensions: dom, json, libxml, mbstring, pdo, phar, tokenizer, xml, xmlwriter
          coverage: pcov

      - run: |
          cd ./clients/php
          composer install
          composer test
        env:
          TEST_SERVER_HOST: localhost:3000

  test-python:
    runs-on: ubuntu-latest
    container: python:3.6.15

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-server

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - run: pip3 install pipenv

      - run: |
          cd ./clients/python
          pipenv install
          pipenv run pytest --cov=vexilla_client
        env:
          TEST_SERVER_HOST: localhost:3000

  test-swift:
    runs-on: ubuntu-latest
    container: swift:5.5-focal

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-server
      - run: |
          swift build
          swift test
        env:
          TEST_SERVER_HOST: localhost:3000
