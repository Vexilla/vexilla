[package]
name = "vexilla_client"
version = "1.0.1"
authors = ["Chris Griffing <cmgriffing@gmail.com>"]
edition = "2018"
description = "A Rust client for the Vexilla Feature Flag System"
license = "BUSL-1.1"
repository = "https://github.com/Vexilla/vexilla"
homepage = "https://vexilla.dev"
documentation = "https://docs.rs/vexilla_client"
readme = "README.md"
include = ["src/**/*.rs", "src/compatibility.json", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]


[dependencies]
reqwest = { version = "0.10", features = ["blocking"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "0.2", features = ["full"] }
strum = "0.25"
strum_macros = "0.25"
convert_case = "^0.3.2"
thiserror = "1.0"
chrono = { version = "0.4.26" }
chrono-tz = "0.8.3"
log = "0.4.21"
ryu-js = "=1.0.3"
